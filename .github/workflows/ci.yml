# .github/workflows/ci.yml
# Pipeline de Integracion Continua para el monorepo "Local B".
# Se ejecuta en push a main y en cada Pull Request.
# Jobs: lint -> type-check -> test -> build (con cache de node_modules).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Evita ejecuciones redundantes cuando se hace push varias veces al mismo PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # -------------------------------------------------------------------
  # Job: audit — auditoria de vulnerabilidades en dependencias (npm audit)
  # Corre en paralelo a lint/type-check/test y no bloquea al resto de la
  # pipeline: solo falla el job ante vulnerabilidades HIGH o CRITICAL, y
  # aun asi se marca continue-on-error para no romper el build mientras
  # se resuelven (el resultado queda visible en el resumen del workflow).
  # -------------------------------------------------------------------
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Solo reporta vulnerabilidades high/critical para evitar ruido de
      # advisories bajas/moderadas en dependencias transitivas.
      - name: npm audit (high y critical)
        run: npm audit --audit-level=high

  # -------------------------------------------------------------------
  # Job: migrations-check — falla si el schema de Prisma y las migraciones
  # versionadas se desincronizan (drift). Evita que se edite schema.prisma
  # sin generar la migración correspondiente. Usa una DB Postgres efímera
  # como shadow para replayar las migraciones y compararlas con el schema.
  # -------------------------------------------------------------------
  migrations-check:
    name: Migrations Drift Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shadow
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: shadow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U shadow -d shadow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # --exit-code devuelve 2 si hay diferencias entre las migraciones
      # versionadas (replayadas en la shadow DB) y el schema actual.
      - name: Verificar sincronización schema ↔ migraciones
        run: >-
          npx prisma migrate diff
          --from-migrations ./prisma/migrations
          --to-schema-datamodel ./prisma/schema.prisma
          --shadow-database-url postgresql://shadow:shadow@localhost:5433/shadow
          --exit-code

  # -------------------------------------------------------------------
  # Job: lint — ESLint/Next lint sobre todos los workspaces (via turbo)
  # -------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Cachea node_modules entre ejecuciones usando el hash de package-lock.json.
      - name: Cachear node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar lint (turbo run lint)
        run: npm run lint

  # -------------------------------------------------------------------
  # Job: type-check — verificacion de tipos TypeScript en cada workspace
  # -------------------------------------------------------------------
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cachear node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Instalar dependencias
        run: npm ci

      # El cliente de Prisma es requerido para que el type-check de
      # server/web resuelva los tipos generados (@prisma/client).
      - name: Generar Prisma Client
        run: npm run db:generate

      - name: Type-check del workspace server (tsc --noEmit)
        run: npx tsc --noEmit -p apps/server/tsconfig.json

      - name: Type-check del workspace web (next lint incluye tsc via next build --dry no aplica)
        run: npx tsc --noEmit -p apps/web/tsconfig.json

  # -------------------------------------------------------------------
  # Job: test — pruebas unitarias/integracion (si existen en cada workspace)
  # -------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    # Servicios necesarios para pruebas de integracion contra una DB real.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: localb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d localb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/localb_test?schema=public
      NODE_ENV: test
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cachear node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npm run db:generate

      # --if-present evita que el job falle si un workspace todavia no
      # tiene script "test" definido (util mientras se agrega cobertura).
      # Con cobertura: los umbrales mínimos viven en vitest.config.ts de cada
      # workspace y hacen fallar el job si la cobertura baja de ese piso.
      - name: Ejecutar tests de todos los workspaces (con cobertura)
        run: npm run test --workspaces --if-present -- --coverage

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/server/coverage
            apps/web/coverage
          retention-days: 7
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Job: e2e — Playwright contra el stack real (Postgres + server + web).
  # Migra una DB efímera, siembra el usuario demo (admin@localb.com), levanta el
  # server compilado y el web en modo producción, y corre e2e/*.spec.ts, que
  # incluye el smoke de TODAS las pantallas del panel (falla ante pageerror o
  # error boundary). Arranca como NO bloqueante (continue-on-error) hasta
  # verificar que corre estable en GitHub Actions; quitar esa línea para
  # volverlo obligatorio.
  # -------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: localb_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d localb_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://e2e:e2e@localhost:5432/localb_e2e?schema=public
      DIRECT_URL: postgresql://e2e:e2e@localhost:5432/localb_e2e?schema=public
      NEXTAUTH_SECRET: ci-e2e-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      FRONTEND_URL: http://localhost:3000
      PLATFORM_ADMIN_EMAILS: admin@localb.com
      QUEUES_DISABLED: 'true'
      E2E_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npm run db:generate

      - name: Migrar la base efímera
        run: npm run db:migrate:deploy

      - name: Sembrar el usuario demo
        run: npm run db:seed

      - name: Compilar el server
        run: npm run build --workspace=server

      - name: Compilar el web
        run: npm run build --workspace=web

      - name: Levantar server y web
        run: |
          PORT=4000 node apps/server/dist/index.js > server.log 2>&1 &
          npm run start --workspace=web > web.log 2>&1 &
          for url in http://localhost:4000/api/health http://localhost:3000/login; do
            for i in $(seq 1 60); do
              curl -fsS "$url" > /dev/null && break
              sleep 2
              if [ "$i" = "60" ]; then echo "No levantó $url"; tail -n 50 server.log web.log; exit 1; fi
            done
          done

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Ejecutar E2E
        run: npm run test:e2e --workspace=web

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            server.log
            web.log
          retention-days: 7
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Job: build — build de produccion de todos los workspaces (turbo)
  # -------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    env:
      # Valores dummy suficientes para que el build de Next.js/tsc no falle
      # por variables de entorno ausentes. Los valores reales se inyectan
      # en el deploy real via secrets.
      DATABASE_URL: postgresql://user:password@localhost:5432/localb?schema=public
      NEXTAUTH_SECRET: ci-build-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cachear node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      # Cache de artefactos de Turborepo para acelerar builds incrementales.
      - name: Cachear Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npm run db:generate

      - name: Build de todos los workspaces
        run: npm run build

      - name: Subir artefactos de build (apps/web/.next)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 3

      - name: Subir artefactos de build (apps/server/dist)
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: apps/server/dist
          retention-days: 3
