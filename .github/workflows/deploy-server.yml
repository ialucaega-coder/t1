# .github/workflows/deploy-server.yml
# Build de la imagen Docker de apps/server y deploy a Google Cloud Run
# en cada push a main.
#
# Secrets de GitHub necesarios (Settings > Secrets and variables > Actions):
#   - GCP_PROJECT_ID     ID del proyecto de Google Cloud.
#   - GCP_SA_KEY         JSON completo de la Service Account (credenciales).
#   - GCP_REGION         Region de Cloud Run (ej. southamerica-east1).
#   - CLOUD_RUN_SERVICE  Nombre del servicio de Cloud Run a actualizar.
#
# La Service Account necesita, como minimo, los roles:
#   roles/run.admin, roles/artifactregistry.writer, roles/iam.serviceAccountUser.
#
# NUNCA se hardcodean valores reales: todo viene de ${{ secrets.* }}.
# Las variables de entorno / secretos de la app (DATABASE_URL, etc.) se
# configuran directamente en el servicio de Cloud Run, no en este workflow.

name: Deploy Server (Cloud Run)

on:
  push:
    branches: [main]
    # Solo dispara si cambian el backend, el schema de Prisma o el Dockerfile.
    paths:
      - 'apps/server/**'
      - 'packages/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-server.yml'
  # Permite lanzar el deploy manualmente desde la pestana Actions.
  workflow_dispatch:

concurrency:
  group: deploy-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build y deploy a Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Repositorio de Artifact Registry donde se publica la imagen.
      AR_REPOSITORY: local-b
      IMAGE_NAME: server
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Autenticar contra Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Asegura que exista el repo de Artifact Registry (idempotente).
      - name: Asegurar repositorio de Artifact Registry
        run: |
          gcloud artifacts repositories describe "$AR_REPOSITORY" \
            --location="${{ secrets.GCP_REGION }}" >/dev/null 2>&1 || \
          gcloud artifacts repositories create "$AR_REPOSITORY" \
            --repository-format=docker \
            --location="${{ secrets.GCP_REGION }}" \
            --description="Imagenes de Local B"

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Definir tag de la imagen
        id: image
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${AR_REPOSITORY}/${IMAGE_NAME}"
          echo "uri=${IMAGE}" >> "$GITHUB_OUTPUT"

      # Build usando el Dockerfile multi-stage de apps/server desde la raiz del repo.
      - name: Build de la imagen Docker
        run: |
          docker build \
            -f apps/server/Dockerfile \
            -t "${{ steps.image.outputs.uri }}:${{ github.sha }}" \
            -t "${{ steps.image.outputs.uri }}:latest" \
            .

      - name: Push de la imagen
        run: |
          docker push "${{ steps.image.outputs.uri }}:${{ github.sha }}"
          docker push "${{ steps.image.outputs.uri }}:latest"

      - name: Deploy a Cloud Run
        run: |
          gcloud run deploy "${{ secrets.CLOUD_RUN_SERVICE }}" \
            --image="${{ steps.image.outputs.uri }}:${{ github.sha }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --platform=managed \
            --port=4000 \
            --allow-unauthenticated
